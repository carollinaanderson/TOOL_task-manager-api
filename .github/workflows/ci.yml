name: CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: task_user
          POSTGRES_PASSWORD: task_pass
          POSTGRES_DB: task_manager
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U task_user"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://task_user:task_pass@localhost:5432/task_manager
      APP_SECRET_KEY: ci-secret-key-32-bytes-minimum!!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Security scan (code)
        run: bandit -r app -q
      - name: Security scan (secrets, full git history)
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          gitleaks git . --no-banner --redact
      - name: Migrate
        run: alembic upgrade head
      - name: Tests
        run: pytest -q
      - name: Build image
        run: docker build -t task-manager-api .
